name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Go build/module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and test backend
        working-directory: backend
        run: |
          go mod download
          make build
          go vet ./...
          go test ./...
  flutter-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter env info
        run: |
          flutter --version
          flutter doctor -v
          flutter config --enable-web
      - name: Flutter pub get and analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze || true
      - name: Flutter web build
        working-directory: app
        run: |
          flutter clean
          flutter build web --release --web-renderer auto --dart-define=API_BASE_URL=/api --verbose
