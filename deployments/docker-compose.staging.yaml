services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=staging
      - LOG_LEVEL=info
      - HTTP_ADDR=:8080
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - RATE_LIMIT_REQUESTS=30
      - RATE_LIMIT_WINDOW_SEC=60
    depends_on:
      - redis
    ports:
      - "8080:8080"

  web:
    build:
      context: ../app
      dockerfile: Dockerfile.web
      args:
        - API_BASE_URL=/api
    depends_on:
      - backend
    ports:
      - "8081:80"
